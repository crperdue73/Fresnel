<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Fresnel — a read-only service catalogue">
  <defs>
    <radialGradient id="glow" cx="18%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#f2a65a" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#f2a65a" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1015"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tilefill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- the lens: concentric aperture, plus refracting rays -->
  <g transform="translate(1090 152)" fill="none" stroke="#f2a65a">
    <circle r="162" stroke-opacity="0.09" stroke-width="1"/>
    <circle r="126" stroke-opacity="0.14" stroke-width="1"/>
    <circle r="92"  stroke-opacity="0.22" stroke-width="1"/>
    <circle r="56"  stroke-opacity="0.34" stroke-width="1.2"/>
    <circle r="13"  stroke-opacity="0.9" stroke-width="1.8"/>
    <g stroke-opacity="0.22" stroke-width="1">
      <path d="M-214 -70 L-126 -44"/>
      <path d="M-214 -28 L-126 -17"/>
      <path d="M-214  14 L-126  10"/>
      <path d="M-214  58 L-126  40"/>
    </g>
    <g stroke-opacity="0.30" stroke-width="1">
      <path d="M126 -40 L214 -60"/>
      <path d="M126 -8  L214 -12"/>
      <path d="M126  24 L214  40"/>
      <path d="M126  52 L214  84"/>
    </g>
  </g>

  <!-- the accent swatches: one per category area -->
  <g transform="translate(596 235)">
    <circle cx="0" cy="0" r="4.5" fill="#f2a65a" opacity="0.9"/>
    <circle cx="18" cy="0" r="4.5" fill="#5aa7f2" opacity="0.75"/>
    <circle cx="36" cy="0" r="4.5" fill="#7fc9a0" opacity="0.75"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(88 100)">
    <g transform="translate(0 -4) scale(1.18)" fill="none" stroke="#f2a65a" stroke-width="1.6">
      <circle cx="17" cy="17" r="13.5" stroke-opacity="0.95"/>
      <circle cx="17" cy="17" r="4.6" stroke-opacity="0.95"/>
      <path d="M17 0.5v4M17 29.5v4M0.5 17h4M29.5 17h4" stroke-linecap="round" stroke-opacity="0.55"/>
    </g>

    <text x="58" y="34" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="68" font-weight="bold" letter-spacing="-2.6" fill="#e9eef5">Fresnel</text>

    <text x="61" y="72" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15.5" letter-spacing="4.2" fill="#8fa0b2">A READ-ONLY SERVICE CATALOGUE</text>
  </g>

  <!-- the one line that says what it is -->
  <text x="88" y="248" font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="19.5" fill="#a3b1bf">The page has no write path. The file is the dashboard.</text>

  <!-- hairline -->
  <rect x="88" y="282" width="1104" height="1" fill="url(#rule)"/>
</svg>
