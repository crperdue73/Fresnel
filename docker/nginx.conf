# Fresnel — static, read-only, nothing to exploit.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset       utf-8;
    server_tokens off;

    # no inline script, no third-party script, no framing, no leaked referrers
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self' https:" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Permissions-Policy      "geolocation=(), camera=(), microphone=()" always;

    gzip              on;
    gzip_min_length   512;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # the catalogue changes whenever the file does — never serve it stale
    location = /services.json {
        expires -1;
        try_files $uri =404;
    }

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # no directory listings, no dotfiles
    autoindex off;
    location ~ /\. { deny all; }
}
