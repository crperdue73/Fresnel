# Fresnel — sample catalogue
#
# This file is the page. Edit it, run `make build`, reload.
# Schema: README.md

title: Fresnel
subtitle: sample catalogue
accent: "#f2a65a"        # the one light source: focus rings, glow, pinned edges
theme: dark              # dark | light
search_provider: duckduckgo

# the five things you actually open — rendered as one row at the top
pinned:
  - Gmail
  - GitHub
  - Wikipedia
  - Weather

categories:

  - name: Everyday
    accent: "#f2a65a"
    services:
      - name: Gmail
        url: https://mail.google.com
        description: Mail, and the inbox you keep meaning to clear
        tags: [mail, google]
        icon: https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico
        icon_host: mail.google.com

      - name: Calendar
        url: https://calendar.google.com
        description: Where the week actually lives
        tags: [calendar, google]
        icon: https://www.gstatic.com/calendar/images/dynamiclogo_2020q4/calendar_31_2x.png
        icon_host: calendar.google.com

      - name: Drive
        url: https://drive.google.com
        description: Documents, sheets, the usual sprawl
        tags: [files, google]
        icon: https://ssl.gstatic.com/images/branding/product/1x/drive_2020q44_32dp.png
        icon_host: drive.google.com

      - name: YouTube
        url: https://www.youtube.com
        description: Two hours gone before you noticed
        tags: [video]
        icon: https://icons.duckduckgo.com/ip3/youtube.com.ico

      - name: Reddit
        url: https://www.reddit.com
        description: The front page of the argument
        tags: [news, community]
        icon: https://icons.duckduckgo.com/ip3/reddit.com.ico

  - name: Reference
    accent: "#5aa7f2"
    services:
      - name: Wikipedia
        url: https://en.wikipedia.org
        description: Start here, end somewhere else entirely
        tags: [reference]
        icon: https://icons.duckduckgo.com/ip3/en.wikipedia.org.ico

      - name: MDN
        url: https://developer.mozilla.org
        description: The documentation that is actually right
        tags: [docs, web]
        icon: https://icons.duckduckgo.com/ip3/developer.mozilla.org.ico

      - name: Stack Overflow
        url: https://stackoverflow.com
        description: Somebody had your problem in 2013
        tags: [code, qa]
        icon: https://icons.duckduckgo.com/ip3/stackoverflow.com.ico

      - name: Internet Archive
        url: https://archive.org
        description: The web, remembered
        tags: [archive]
        icon: https://icons.duckduckgo.com/ip3/archive.org.ico

  - name: Work
    accent: "#a78bfa"
    services:
      - name: GitHub
        url: https://github.com
        description: Repos, issues, pull requests
        tags: [code, git]
        icon: https://icons.duckduckgo.com/ip3/github.com.ico

      - name: Hacker News
        url: https://news.ycombinator.com
        description: Where everyone is an expert by lunchtime
        tags: [news, tech]
        icon: https://icons.duckduckgo.com/ip3/news.ycombinator.com.ico

      - name: Docker Hub
        url: https://hub.docker.com
        description: Images, tags, and one more pull
        tags: [docker, infra]
        icon: https://icons.duckduckgo.com/ip3/hub.docker.com.ico
        status: beta

      - name: Let's Encrypt
        url: https://letsencrypt.org
        description: The reason the padlock is free
        tags: [tls, infra]
        icon: https://icons.duckduckgo.com/ip3/letsencrypt.org.ico

  - name: Out there
    accent: "#7fc9a0"
    services:
      - name: Weather
        url: https://weather.gov
        description: Forecast with no advertising
        tags: [weather]
        icon: https://icons.duckduckgo.com/ip3/weather.gov.ico

      - name: BBC
        url: https://www.bbc.com/news
        description: News, spelled correctly
        tags: [news]
        icon: https://icons.duckduckgo.com/ip3/bbc.com.ico

      - name: OpenStreetMap
        url: https://www.openstreetmap.org
        description: Maps you are allowed to fix
        tags: [maps]
        icon: https://icons.duckduckgo.com/ip3/openstreetmap.org.ico

      - name: Down Detector
        url: https://downdetector.com
        description: Is it them, or is it you
        tags: [status]
        icon: https://icons.duckduckgo.com/ip3/downdetector.com.ico
        status: new
