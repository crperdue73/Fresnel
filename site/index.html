<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fresnel</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1117'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f2a65a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23f2a65a'/%3E%3C/svg%3E">
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="8.2"/>
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 3.8v2.4M12 17.8v2.4M3.8 12h2.4M17.8 12h2.4" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1 id="title">Fresnel</h1>
          <p id="subtitle" hidden></p>
        </div>
      </div>

      <form class="search" id="search-form" role="search" autocomplete="off">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="6.4"/><path d="m16 16 4.2 4.2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="Filter services, or search the web" aria-label="Filter services or search the web" spellcheck="false">
        <kbd class="hint" aria-hidden="true">/</kbd>
      </form>
    </header>

    <main id="catalogue" aria-live="polite">
      <p class="loading" id="loading">reading the catalogue…</p>
    </main>

    <footer class="footer">
      <span id="count"></span>
      <span class="dot" aria-hidden="true">·</span>
      <span id="generated"></span>
      <span class="dot" aria-hidden="true">·</span>
      <span>read-only — edit <code>config/services.yaml</code></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
